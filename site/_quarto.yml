project:
  type: website
  output-dir: _site
  # The data contract is published as-is so anyone can check a number against its file.
  resources:
    - "data/v1/**"
    - "assets/**"

website:
  title: "Public Data Intelligence"
  description: "Research pages built from free public data for the United States and Southeast Asia."
  repo-url: https://github.com/liumOazed/public-data-intelligence
  repo-actions: [source]
  navbar:
    logo: assets/logo.svg
    logo-alt: "Public Data Intelligence"
    title: "Public Data Intelligence"
    right:
      - text: "This week"
        href: unusual.qmd
      - text: "Monthly brief"
        href: briefs/index.qmd
      - text: "Research"
        menu:
          - text: "Tech Value"
          - text: "Value ranking"
            href: tech-value/index.qmd
          - text: "Fair price"
            href: tech-value/fair-price.qmd
          - text: "Over & under performers"
            href: tech-value/residuals.qmd
          - text: "Model and leaderboard"
            href: tech-value/model.qmd
          - text: "---"
          - text: "Macro Monitor"
          - text: "What moved unusually"
            href: macro/index.qmd
          - text: "24-month backtest"
            href: macro/backtest.qmd
          - text: "Series"
            href: macro/series.qmd
          - text: "Forecast test"
            href: macro/model.qmd
          - text: "---"
          - text: "Trade & Supply Chain"
          - text: "Who supplies the United States"
            href: trade/index.qmd
          - text: "Lead-time test"
            href: trade/lead.qmd
          - text: "---"
          - text: "Energy Demand"
          - text: "Electricity demand"
            href: energy/index.qmd
          - text: "---"
          - text: "Federal Procurement"
          - text: "Computer hardware by month"
            href: procurement/index.qmd
          - text: "Suppliers and competition"
            href: procurement/suppliers.qmd
          - text: "Promised against paid"
            href: procurement/paid.qmd
      - text: "Methodology"
        href: methodology.qmd
  page-footer:
    background: "#0f1e33"
    foreground: "#e9f1f8"
    left: |
      <div class="pdi-foot-title">How the research is built</div>
      <div class="pdi-foot-sub">Public sources · Scheduled updates · Evidence with every finding</div>
      <div class="pdi-foot-note">Research output, not advice. Every number is rebuilt from public sources by a scheduled job.</div>
    right:
      - text: "Methodology"
        href: methodology.qmd
      - text: "Sources"
        href: sources.qmd
      - text: "Decisions"
        href: decisions.qmd
      - text: "Failures log"
        href: failures.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    page-layout: full
    code-fold: true
    code-tools: false

execute:
  echo: false
  warning: false
  # Always re-run: the pages are only as fresh as the files they read.
  freeze: false
  cache: false

jupyter: python3
