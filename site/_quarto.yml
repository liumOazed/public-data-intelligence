project:
  type: website
  output-dir: _site
  # The data contract is published as-is so anyone can check a number against its file.
  resources:
    - "data/v1/**"

website:
  title: "Public Data Intelligence"
  description: "Research pages built from free public data for the United States and Southeast Asia."
  repo-url: https://github.com/liumOazed/public-data-intelligence
  repo-actions: [source]
  navbar:
    left:
      - text: "Tech Value"
        menu:
          - text: "Value ranking"
            href: tech-value/index.qmd
          - text: "Fair price"
            href: tech-value/fair-price.qmd
          - text: "Over- and under-performers"
            href: tech-value/residuals.qmd
          - text: "Model and leaderboard"
            href: tech-value/model.qmd
      - text: "Macro Monitor"
        menu:
          - text: "What moved unusually"
            href: macro/index.qmd
          - text: "24-month backtest"
            href: macro/backtest.qmd
          - text: "Series"
            href: macro/series.qmd
          - text: "Forecast test"
            href: macro/model.qmd
      - text: "Trade"
        menu:
          - text: "Who supplies the United States"
            href: trade/index.qmd
          - text: "Lead-time test"
            href: trade/lead.qmd
      - text: "Energy Demand"
        href: energy/index.qmd
      - text: "Monthly brief"
        href: briefs/index.qmd
      - text: "Methodology"
        href: methodology.qmd
      - text: "Sources"
        href: sources.qmd
      - text: "Failures log"
        href: failures.qmd
  page-footer:
    center: >-
      Research output, not advice. Every number is rebuilt from public sources by a scheduled
      job; see Methodology.

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    page-layout: full
    code-fold: true
    code-tools: false

execute:
  echo: false
  warning: false
  # Always re-run: the pages are only as fresh as the files they read.
  freeze: false
  cache: false

jupyter: python3
