name: Demand Radar experiment (temporary, runs once, attempt 2)
on:
  push:
    branches: [claude/project-thread-qr1gop]
    paths: [.github/workflows/radar.yml]
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - name: Collect pageviews and retail sales
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: uv run python -m pdi.radar.collect
      - name: Run the four tests once
        run: uv run python -m pdi.radar.lead
      - run: uv run pytest -q
      - name: Show the result
        run: cat data/store/radar/lead_test.json
      - name: Commit the stored sums and the result to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store/radar site/data/v1/radar
          git commit -m "Demand Radar: the experiment's one run"
          git pull --rebase origin claude/project-thread-qr1gop
          git push origin HEAD:claude/project-thread-qr1gop
