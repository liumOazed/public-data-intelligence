name: Seed trade (temporary)

# Temporary: first live collection of US imports on this branch. Removed before the PR is final.

on:
  push:
    branches: [claude/project-thread-qr1gop]
    paths: [".github/workflows/seed-trade.yml", "pdi/trade/**"]

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - name: Collect
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          uv run python -m pdi.trade.collect --force
          # The economies' own exports (IMF) for the lead-time test. Not committed from here.
          uv run python -m pdi.macro.collect
          uv run python - <<'PY'
          from pdi import samples
          samples.census()
          PY
      - name: Export and show
        run: |
          uv run python -m pdi.trade.export
          uv run python - <<'PY'
          import json, pandas as pd
          pd.set_option("display.width", 250); pd.set_option("display.max_columns", 30)
          for t in ("partners", "china_shift", "lead_test"):
              d = json.load(open(f"site/data/v1/trade/{t}.json"))
              print("==", t, {k: v for k, v in d["meta"].items() if k in ("finding", "test_ran", "latest_month", "status")})
              print(pd.DataFrame(d["data"]).round(3).to_string())
          d = json.load(open("site/data/v1/trade/totals_check.json"))["meta"]
          print({k: d[k] for k in ("criterion_met", "worst_month_gap_pct", "partner_months")})
          PY
          uv run pytest -q tests/test_trade.py tests/test_live_samples.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store/trade site/data/v1/trade tests/fixtures/live/census_*
          git diff --cached --quiet && exit 0
          git commit -m "First US imports collection and Census test slice $(date -u +%F)"
          git stash -u
          git pull --rebase origin claude/project-thread-qr1gop
          git push origin HEAD:claude/project-thread-qr1gop
