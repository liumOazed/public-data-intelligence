name: Weekly benchmarks and model selection

# Refresh the benchmark tables and retrain AutoGluon. Models are refit on this schedule, not
# on every run, with a fixed time limit on CPU and versions pinned by uv.lock.

on:
  schedule:
    - cron: "43 5 * * 1" # 05:43 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra automl

      - name: Collect and tidy SPEC CPU 2017 results
        run: uv run python -m pdi.tech_value.spec

      - name: Collect and tidy Blender Open Data
        run: uv run python -m pdi.tech_value.blender

      - name: Keep the small raw responses (never committed, never published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: |
            data/raw
            !data/raw/**/*.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Train AutoGluon
        run: uv run python -m pdi.tech_value.automl

      - name: Model and export
        run: uv run python -m pdi.tech_value.export

      - name: Commit derived tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store site/data/v1
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Weekly benchmark and model update $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Open an Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/open_issue.sh "Weekly pipeline failed" \
            "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed on $(date -u +%F). The site was not rebuilt and still shows the last good data."

  site:
    needs: pipeline
    uses: ./.github/workflows/site.yml
