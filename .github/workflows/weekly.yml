name: Weekly benchmarks and model selection

# Refresh the benchmark tables and retrain AutoGluon. Models are refit on this schedule, not
# on every run, with a fixed time limit on CPU and versions pinned by uv.lock.

on:
  schedule:
    - cron: "43 5 * * 1" # 05:43 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest commit on the branch when the job starts, not the one the run was
          # queued on: another pipeline run may have pushed data while this one waited.
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra automl

      - name: Restore the private Amazon and Best Buy price files (Actions cache, never committed)
        uses: actions/cache/restore@v4
        with:
          path: data/store/tech_value/prices/*_brightdata.parquet
          key: amazon-prices-${{ github.run_id }}
          restore-keys: amazon-prices-

      - name: Collect and tidy SPEC CPU 2017 results
        run: uv run python -m pdi.tech_value.spec

      - name: Collect and tidy Blender Open Data
        run: uv run python -m pdi.tech_value.blender

      - name: Collect retail prices (crawler)
        run: uv run python -m pdi.tech_value.retail

      - name: Collect Amazon and Best Buy prices (Bright Data, skipped without a key)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          # Records are billed, so a dry run on another branch asks for four models only.
          PDI_BRIGHTDATA_LIMIT_MODELS: ${{ github.ref != 'refs/heads/main' && '4' || '' }}
        run: uv run python -m pdi.tech_value.brightdata

      - name: Save the private Amazon and Best Buy price files for the daily runs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: data/store/tech_value/prices/*_brightdata.parquet
          key: amazon-prices-${{ github.run_id }}

      - name: Keep the small raw responses (never committed, never published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: |
            data/raw
            !data/raw/**/*.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Train AutoGluon
        run: uv run python -m pdi.tech_value.automl

      - name: Model and export
        run: uv run python -m pdi.tech_value.export

      - name: Show the result
        run: |
          uv run python - <<'PY'
          import json
          d = json.load(open('site/data/v1/tech-value/holdout.json'))
          print(json.dumps(d['meta'].get('verdict'), indent=1))
          print(json.dumps(d['meta'].get('counts'), indent=1))
          for row in d['data']:
              print(row)
          PY

      - name: Commit derived tables
        # A manual run on another branch is a dry run: it tests the pipeline against live
        # sources and publishes nothing.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store site/data/v1
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Weekly benchmark and model update $(date -u +%F)"
            # If another run pushed in between, this run's freshly built tables win: both
            # were built from the same sources, and this run's are newer.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Open an Issue on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/open_issue.sh "Weekly pipeline failed" \
            "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed on $(date -u +%F). The site was not rebuilt and still shows the last good data."

  site:
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site.yml
