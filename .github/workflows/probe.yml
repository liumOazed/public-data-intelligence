name: Probe radar names (temporary)
on:
  push:
    branches: [claude/project-thread-qr1gop]
    paths: [probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/radar_names.py
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
