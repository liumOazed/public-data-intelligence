name: Probe (temporary)
on:
  push:
    branches: [claude/project-thread-qr1gop]
    paths: ["probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python probe/census.py
