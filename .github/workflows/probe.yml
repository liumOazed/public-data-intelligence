name: Probe (temporary)
on:
  push:
    branches: [claude/project-thread-qr1gop]
    paths: ["probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python probe/gaps.py
