name: Macro dry run (temporary)
on:
  push:
    branches: [claude/project-thread-g5e27r]
    paths: [".github/workflows/macro-dryrun.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra automl
      - run: uv run python -m pdi.macro.collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: uv run python -m pdi.macro.export
      - name: Flags
        run: |
          uv run python - <<'PY'
          import json
          for t in ("flags_latest", "flags_backtest"):
              d = json.load(open(f"site/data/v1/macro/{t}.json"))
              print(t, len(d["data"]), json.dumps(d["meta"].get("summary")))
              for r in d["data"][:60]:
                  print(" ", r["period"][:7], r["kind"], round(r["z"], 1), r["outcome"], "|", r["sentence"])
          d = json.load(open("site/data/v1/macro/series.json"))
          for r in d["data"]:
              print(r["series_id"], r["latest_month"][:7], r["value"], r["move"], r["z"], r["months_of_history"])
          PY
      - run: uv run python -m pdi.macro.automl
      - run: uv run python -m pdi.macro.export
      - name: Forecast test
        run: |
          cat data/store/macro/automl_summary.json
          uv run python -c "import pandas as pd; print(pd.read_parquet('data/store/macro/automl_leaderboard.parquet').to_string()); print(pd.read_parquet('data/store/macro/automl_holdout.parquet').to_string()); print(pd.read_parquet('data/store/macro/automl_per_series.parquet').to_string())"
      - name: Commit the first tables to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store/macro site/data/v1/macro
          git commit -m "First Macro Monitor tables from live sources $(date -u +%F)"
          git push origin HEAD:claude/project-thread-g5e27r
