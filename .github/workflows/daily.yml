name: Daily pipeline

# Collect today's prices and the macro series, rebuild the exported tables, publish the site.
# If any step fails, the site is not rebuilt (it keeps showing the last good data) and an
# Issue is opened.

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC every day; scheduled start times can slip
    # A second chance. GitHub can drop a scheduled start altogether (it did on 15 November
    # 2026). This one runs the pipeline only if no run has succeeded yet today.
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      fire_drill:
        description: "Make the crawler fail on purpose, to check that an Issue opens"
        type: boolean
        default: false

permissions:
  actions: read # the monthly brief counts this workflow's own runs
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event.schedule }}" = "47 19 * * *" ]; then
            today=$(date -u +%F)
            done_today=$(gh run list --repo "${{ github.repository }}" --workflow daily.yml \
              --branch main --status success --limit 20 --json createdAt \
              --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | length")
            if [ "${done_today:-0}" -gt 0 ]; then
              echo "A daily run already succeeded on $today; the second chance is not needed."
              run=false
            else
              echo "No daily run has succeeded on $today; running now."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest commit on the branch when the job starts, not the one the run was
          # queued on: another pipeline run may have pushed data while this one waited.
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Restore the private Amazon and Best Buy price files (Actions cache, never committed)
        uses: actions/cache/restore@v4
        with:
          path: data/store/tech_value/prices/*_brightdata.parquet
          key: amazon-prices-${{ github.run_id }}
          restore-keys: amazon-prices-

      - name: Collect retail prices (crawler)
        env:
          PDI_FIRE_DRILL: ${{ inputs.fire_drill && '1' || '' }}
        run: uv run python -m pdi.tech_value.retail

      - name: Collect retail prices (Best Buy API, skipped without a key)
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: uv run python -m pdi.tech_value.bestbuy

      - name: Collect retail prices (eBay Browse API, skipped without a key)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: uv run python -m pdi.tech_value.ebay


      - name: Keep the raw responses (never committed, never published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw
          if-no-files-found: ignore
          retention-days: 90

      - name: Collect the US electricity price (BLS through FRED)
        # A failed download keeps the stored series; the efficiency page then uses its last month.
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python -m pdi.tech_value.electricity

      - name: Collect macro series (FRED, BIS, OpenDOSM, IMF, Indeed)
        env:
          # Optional. Without it the collector uses FRED's public CSV download.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python -m pdi.macro.collect

      - name: Collect electricity demand (Ember; skipped when fetched in the last six days)
        run: uv run python -m pdi.energy.collect

      - name: Collect US imports by product (Census; skipped when fetched in the last six days)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: uv run python -m pdi.trade.collect

      - name: Model and export
        run: |
          uv run python -m pdi.tech_value.export
          uv run python -m pdi.macro.export
          uv run python -m pdi.energy.export
          uv run python -m pdi.trade.export
          # Federal contracts are collected by the weekly run; the daily run only rewrites
          # the tables from what is stored.
          uv run python -m pdi.procurement.export

      - name: What's unusual this week (stops the run on a prediction without a passed test)
        run: uv run python -m pdi.unusual

      - name: Monthly brief (first run of a month writes last month's; otherwise does nothing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow daily.yml --branch main --limit 200 \
            --json conclusion,createdAt,event > "$RUNNER_TEMP/runs.json" || echo "[]" > "$RUNNER_TEMP/runs.json"
          uv run python -m pdi.brief --runs "$RUNNER_TEMP/runs.json"

      - name: Commit derived tables
        # A manual run on another branch is a dry run: it tests the pipeline against live
        # sources and publishes nothing.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store site/data/v1 site/briefs
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily data update $(date -u +%F)"
            # If another run pushed in between, this run's freshly built tables win: both
            # were built from the same sources, and this run's are newer.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Open an Issue on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/open_issue.sh "Daily pipeline failed" \
            "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed on $(date -u +%F). The site was not rebuilt and still shows the last good data."

  site:
    needs: pipeline
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site.yml
