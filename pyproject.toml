[project]
name = "pdi"
version = "0.1.0"
description = "Public Data Intelligence: scheduled collectors, models and a static Quarto site"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pandera[pandas]>=0.20",
    "requests>=2.31",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Heavy; installed only by the scheduled training workflow.
automl = ["autogluon.tabular[lightgbm,catboost,xgboost]>=1.2"]
# What the Quarto build needs to execute the pages.
site = ["jupyter>=1.0", "plotly>=5.20", "itables>=2.0", "tabulate>=0.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
