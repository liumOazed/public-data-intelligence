# Source registry. Every source the pipeline touches has one entry here.
#
# status:        green = free, programmatic, stable; amber = public but awkward or terms unclear;
#                red = closing, gated or prohibited (do not build on it).
# publish:       what may appear on the public site. "derived" means aggregates, model outputs and
#                charts with attribution, never the raw response.
# terms_checked: the date somebody last read the source's terms. Re-read amber sources twice a year.
#                "unconfirmed" means nobody has read them yet and the entry is from memory.
sources:
  spec_cpu2017:
    name: SPEC CPU 2017 published results
    owner: Standard Performance Evaluation Corporation
    url: https://www.spec.org/cpu2017/results/
    endpoint: https://www.spec.org/cgi-bin/osgresults
    licence: >-
      SPEC Fair Use Rules (https://www.spec.org/products/fairuse). Public use is allowed when the
      source and retrieval date are stated, the licensee of each result is identifiable, the SPEC
      trademarks are acknowledged, SPEC metrics are compared only with SPEC metrics of the same
      benchmark release, and derived values and estimates are clearly labelled and never called
      SPEC metrics. The site does all of these.
    frequency: weekly collection; SPEC publishes new results about every two weeks
    typical_lag: results appear weeks to months after the test date
    status: green
    publish: derived
    module: tech-value
    terms_checked: 2026-11-14
    notes: >-
      Vendor-submitted and dominated by servers. Used to prove the residual method, not to rank
      consumer parts.

  spec_gwpg:
    name: SPEC Graphics and Workstation Performance Group (GWPG) published results
    owner: Standard Performance Evaluation Corporation (SPEC/GWPG)
    url: https://gwpg.spec.org/
    endpoint: https://www.spec.org/gwpg/gpc.static/specviewperfresults.html
    licence: >-
      SPEC Fair Use Rules (https://www.spec.org/products/fairuse). Public use is allowed when the
      source and retrieval date are stated, the licensee of each result is identifiable, the SPEC,
      SPECviewperf, SPECworkstation and SPECapc trademarks are acknowledged, SPEC metrics are
      compared only within the same benchmark release and resolution, and derived values and
      estimates are clearly labelled and never called SPEC metrics. The site does all of these.
    frequency: weekly collection; SPEC/GWPG publishes new workstation and GPU results periodically
    typical_lag: results appear weeks to months after the test date
    status: green
    publish: derived
    module: tech-value
    terms_checked: 2026-11-19
    notes: >-
      Vendor-submitted workstation GPU benchmarks across SPECviewperf (15 Windows and Linux,
      2020, 13, 12.1), SPECworkstation (4.0, 3.1, 3.0) and SPECapc (Solidworks 2025, 2024 and
      2022, Siemens NX 2024, Maya 2024, Creo 9, 3ds Max 2020). Used to compute out-of-fold GPU
      specification residuals alongside SPEC CPU 2017. The SPECworkstation pages also give a CPU
      subsystem score, kept as a separate CPU measurement (spec_workstation_cpu). The collector
      waits five seconds between pages, as spec.org's robots.txt asks. Reachable from GitHub's
      runners (the weekly job), so it needs no other machine.

  spec_power:
    name: SPECpower_ssj2008 published results
    owner: Standard Performance Evaluation Corporation
    url: https://www.spec.org/power_ssj2008/results/
    endpoint: https://www.spec.org/cgi-bin/osgresults
    licence: >-
      SPEC Fair Use Rules (https://www.spec.org/products/fairuse), the same general rules as
      SPEC CPU 2017: state the source and retrieval date, name the licensee of each result,
      acknowledge the SPEC trademarks, compare SPEC metrics only within the same benchmark, and
      label derived values. The SPECpower section of those rules has not been re-read for this
      entry, because spec.org could not be reached from the build machine on 22 November 2026.
    frequency: weekly collection; SPEC publishes new results every few weeks
    typical_lag: results appear weeks to months after the test date
    status: amber
    publish: derived
    module: tech-value
    terms_checked: 2026-11-14
    notes: >-
      Measured AC power of whole servers at eleven load levels, with active idle. Only results
      that name their processor are used, grouped by processor (efficiency page). Reachable from
      GitHub's runners (the weekly job). Move to green once the SPECpower section of the Fair
      Use Rules has been read.

  mlperf_inference:
    name: MLPerf® Inference results (MLCommons results repositories)
    owner: MLCommons Association
    url: https://github.com/mlcommons/inference_results_v5.1
    endpoint: https://raw.githubusercontent.com/mlcommons/inference_results_v{round}/main/summary_results.json
    licence: >-
      Repositories are Apache 2.0. Use of the MLPerf name follows the MLPerf Results Messaging
      Guidelines (https://github.com/mlcommons/policies/blob/master/MLPerf_Results_Messaging_Guidelines.adoc):
      ® on every use of the name, the trademark legend, the submitter, benchmark, version and
      system named beside each result, perf per watt only from MLPerf measured system power,
      comparisons only between compatible results (same benchmark and scenario), and derived
      metrics labelled as not official. Non-submitters may publish two weeks after a round's
      publication. The site does all of these.
    frequency: weekly collection; MLCommons publishes two inference rounds a year
    typical_lag: published on the round's release date
    status: green
    publish: derived
    module: tech-value
    terms_checked: 2026-11-22
    notes: >-
      Only Closed-division results with an MLPerf Power measurement are kept. Very few
      submitters measure power: two systems across rounds 5.0 and 5.1, none in 6.0.

  openbenchmarking:
    name: OpenBenchmarking.org (Phoronix Test Suite results)
    owner: Phoronix Media
    url: https://openbenchmarking.org/
    licence: >-
      robots.txt allows all paths for ordinary user agents and sets the content signal
      search=yes, ai-train=no, use=reference. Result reuse terms not read yet.
    frequency: not collected
    typical_lag: results appear as users upload them
    status: red
    publish: none
    module: tech-value
    terms_checked: unconfirmed
    notes: >-
      Would add consumer CPUs and GPUs that SPEC does not cover. On 20 November 2026 every page,
      including robots-allowed result and test pages, answered a plainly identified client with
      a Cloudflare managed challenge (HTTP 403, "Just a moment..."), from a home PC as
      well as from a cloud sandbox. Nothing here tries to get past it. Usable only if the
      operator offers an export or allows this client; ask before building on it.

  blender_opendata:
    name: Blender Open Data benchmark snapshots
    owner: Blender Foundation
    url: https://opendata.blender.org/
    endpoint: https://opendata.blender.org/snapshots/opendata-latest.zip
    licence: >-
      CC0 (Creative Commons Zero), stated on https://opendata.blender.org/download/ and in the
      LICENSE.txt shipped in each snapshot. No conditions on reuse; the site credits it anyway.
    frequency: weekly collection; snapshots are regenerated daily
    typical_lag: about one day
    status: green
    publish: derived
    module: tech-value
    terms_checked: 2026-11-14
    notes: >-
      Crowd-submitted, so the test configuration (memory, cooling, drivers) is not controlled.
      Scores from different Blender versions are never combined. From 20 November 2026 it also
      feeds its own over- and under-performer models (pdi/tech_value/blender_model.py), kept
      apart from the SPEC models and used only for kinds that pass the held-out baseline check
      and the cross-version residual check (15% median gap, as for SPEC GWPG suites). On 20
      November 2026 the site's robots.txt (a Cloudflare-managed file) disallowed /snapshots/
      for all user agents, while https://opendata.blender.org/download/ still offers the same
      snapshot for download under CC0. The weekly job downloads one file a week from that
      link; ask the Blender Foundation if this should stop.

  geekbench_browser:
    name: Geekbench Browser
    owner: Primate Labs
    url: https://browser.geekbench.com/
    licence: >-
      Geekbench 6 EULA (https://www.primatelabs.com/legal/eula-v6.html, updated 14 March 2025)
      gives Primate Labs the sole and exclusive right to use and distribute uploaded benchmark
      results and forbids automated access to the app. robots.txt (read 20 November 2026)
      disallows the search pages (/v6/cpu/search and others) and sets the content signal
      search=yes, ai-train=no, use=reference.
    frequency: not collected
    typical_lag: results appear as users upload them
    status: red
    publish: none
    module: tech-value
    terms_checked: 2026-11-20
    notes: >-
      Covers almost every consumer CPU, but the rights in the results sit with Primate Labs and
      there is no export. Usable only with Primate Labs' permission.

  passmark:
    name: PassMark CPU and GPU benchmark charts (cpubenchmark.net, videocardbenchmark.net)
    owner: PassMark Software
    url: https://www.cpubenchmark.net/
    licence: >-
      A PassMark administrator wrote on its forum (July 2017): "No, you can't copy all the data
      from our website and use it as your own", and offered to discuss licensing. robots.txt
      (read 20 November 2026) sets the same content signal as Geekbench's.
    frequency: not collected
    typical_lag: results appear as users upload them
    status: red
    publish: none
    module: tech-value
    terms_checked: 2026-11-20
    notes: Needs a paid data licence.

  techpowerup_db:
    name: TechPowerUp GPU and CPU databases
    owner: TechPowerUp
    url: https://www.techpowerup.com/gpu-specs/
    licence: >-
      No export or API, and no reuse terms found. Its robots.txt could not be read through this
      project's fetcher on 20 November 2026.
    frequency: not collected
    typical_lag: editorial
    status: red
    publish: none
    module: tech-value
    terms_checked: unconfirmed
    notes: >-
      "Relative performance" is TechPowerUp's own summary of its reviews, not a benchmark
      result, so it would not be a measurement even if collected.

  cinebench_reviews:
    name: Cinebench scores in published reviews
    owner: Individual review sites
    url: https://www.maxon.net/en/cinebench
    licence: Each review is copyrighted by its publisher; no shared dataset exists.
    frequency: not collected
    typical_lag: weeks after a product launch
    status: red
    publish: none
    module: tech-value
    terms_checked: 2026-11-20
    notes: >-
      No structured source to collect from automatically. Would need per-site permission and a
      hand-checked parser for every review layout.

  bestbuy_products:
    name: Best Buy Products API
    owner: Best Buy
    url: https://developer.bestbuy.com/
    endpoint: https://api.bestbuy.com/v1/products
    licence: >-
      Best Buy developer API terms. They restrict caching and display of prices; read them before
      the price history is shown publicly.
    frequency: daily collection
    typical_lag: same day; each price carries Best Buy's own price update date
    status: amber
    publish: derived
    module: tech-value
    terms_checked: unconfirmed
    secret: BESTBUY_API_KEY
    notes: >-
      Not collecting. Best Buy issues API keys to company email addresses only, so there is no
      key yet. Listing prices at one US retailer, not transaction prices. Daily prices cannot be backfilled, so this collector should run from day one.

  ebay_browse:
    name: eBay US Buy It Now listings (Browse API)
    owner: eBay Inc.
    url: https://developer.ebay.com/api-docs/buy/browse/overview.html
    endpoint: https://api.ebay.com/buy/browse/v1/item_summary/search
    licence: >-
      eBay API License Agreement (https://developer.ebay.com/join/api-license-agreement).
      Public display of derived lowest-price comparisons with a link back to the listing is
      permitted; raw listing feeds are not redistributed in bulk.
    frequency: daily collection
    typical_lag: same day
    status: amber
    publish: derived
    module: tech-value
    terms_checked: 2026-11-17
    secret: EBAY_CLIENT_ID
    notes: >-
      Official REST API (5,000 free calls/day). Filtered strictly to Brand New (conditionId
      1000), fixed-price (Buy It Now), US-located listings from established sellers (>= 98%
      positive feedback and >= 100 feedback score), including shipping in the compared price.


  centralcomputer:
    name: Central Computers online store
    owner: Central Computers
    url: https://www.centralcomputer.com/
    endpoint: https://www.centralcomputer.com/catalogsearch/result/
    licence: >-
      No data licence and no website-use terms found. The store's "Terms and Conditions" pages
      cover orders, returns and warranty; none of the text read mentions automated access or
      reuse. Public search pages are crawled only where robots.txt allows it. The site shows a
      lowest price per model with a link back, never the store's listings in bulk.
    frequency: daily collection
    typical_lag: same day
    status: amber
    publish: derived
    module: tech-value
    terms_checked: 2026-11-14
    notes: >-
      A small US retailer (California). Collected by a crawler that reads robots.txt on every
      run, identifies itself and waits between requests. Listing prices, not transaction prices,
      and only what this one store stocks. Checked on 14 November 2026: robots.txt allowed the
      search page and the site answered a plainly identified client.

  amazon_brightdata:
    name: Amazon US listings via Bright Data
    owner: Bright Data (data provider); Amazon (retailer)
    url: https://brightdata.com/products/web-scraper
    endpoint: https://api.brightdata.com/datasets/v3/trigger
    licence: >-
      Amazon's Conditions of Use exclude "any collection and use of any product listings,
      descriptions, or prices" and "any use of data mining, robots, or similar data gathering
      and extraction tools". Bright Data's Master Service Agreement (https://brightdata.com/license)
      grants no rights in the collected data, bars republishing it to offer a competing product,
      and makes the customer solely responsible for lawful use. The owner chose (14 November
      2026) to keep using these prices but never commit or publish the raw rows: they stay in
      a private Actions cache, and only derived tables reach the site.
    frequency: weekly collection
    typical_lag: same day
    status: amber
    publish: derived
    module: tech-value
    terms_checked: 2026-11-14
    secret: BRIGHTDATA_API_KEY
    notes: >-
      Paid provider with a free allowance of 5,000 records a month. One keyword search per
      benchmarked model, five results each, about 400 records a run. Listings include
      marketplace sellers, so a price is not always Amazon's own. Listing prices, not
      transaction prices.

  bestbuy_brightdata:
    name: Best Buy listings via Bright Data
    owner: Bright Data (data provider); Best Buy (retailer)
    url: https://brightdata.com/products/web-scraper
    endpoint: https://api.brightdata.com/datasets/v3/trigger
    licence: >-
      Best Buy's website terms have not been read for this project yet, so reuse rights are
      unconfirmed. Until they are, the rows are handled like Amazon's: never committed or
      published, kept in a private Actions cache, and only derived tables reach the site.
      Bright Data's Master Service Agreement (https://brightdata.com/license) grants no rights
      in the collected data and makes the customer solely responsible for lawful use.
    frequency: weekly collection
    typical_lag: same day
    status: amber
    publish: derived
    module: tech-value
    terms_checked: unconfirmed
    secret: BRIGHTDATA_API_KEY
    notes: >-
      Added 14 November 2026. One keyword search per benchmarked model, five results each,
      about 400 records a run. Collection is slow (over 20 minutes for four searches in the
      first test) and about a third of the first test's records were collector timeouts.
      Only bare parts sold by Best Buy itself count. Listing prices, not transaction prices.

  fred:
    name: FRED, Federal Reserve Economic Data
    owner: Federal Reserve Bank of St. Louis (aggregator); BLS, BEA, Census Bureau, Federal Reserve Board (publishers)
    url: https://fred.stlouisfed.org/
    endpoint: https://api.stlouisfed.org/fred/series/observations
    licence: >-
      FRED API Terms of Use (https://fred.stlouisfed.org/docs/api/terms_of_use.html). The terms
      require the notice "This product uses the FRED® API but is not endorsed or certified by
      the Federal Reserve Bank of St. Louis", which the site prints. Series owned by third
      parties carry the word "Copyright" in their notes and need the owner's permission
      beyond personal use, so the catalogue holds only series published by US federal
      agencies (public domain) and the collector stops on any series whose notes say
      Copyright. The terms do not address storing data.
    frequency: weekly collection; most series are monthly
    typical_lag: two to eight weeks after the month ends, depending on the series
    status: green
    publish: derived
    module: macro
    terms_checked: 2026-11-15
    secret: FRED_API_KEY
    notes: >-
      Without the key the collector falls back to FRED's public CSV download for the same
      series and cannot run the copyright check. Values are the latest revised figures;
      first-seen values are kept in data/store/macro/vintages.parquet from the first run.

  bis:
    name: BIS statistics (policy rates, consumer prices, exchange rates, effective exchange rates)
    owner: Bank for International Settlements, from national central banks and statistics offices
    url: https://data.bis.org/
    endpoint: https://stats.bis.org/api/v1/data
    licence: >-
      Terms of permitted use of BIS statistics (https://www.bis.org/terms_statistics.htm).
      Use is unrestricted provided the BIS is cited as the source, the use does not imply
      endorsement, and inclusion in a commercial product brings no additional charge to
      users. The statistics are not investment advice. The site cites the BIS under every
      table.
    frequency: weekly collection; series are monthly
    typical_lag: one to three months
    status: green
    publish: derived
    module: macro
    terms_checked: 2026-11-15
    notes: >-
      Used for the six Southeast Asian economies because one definition per measure makes
      countries comparable. Vietnam appears only in the exchange rate table and Singapore has
      no policy rate. Malaysia's exchange rate is end of period; the others are monthly
      averages. Rebased and revised without notice, so moves, not levels, are compared.

  opendosm:
    name: OpenDOSM (Department of Statistics Malaysia)
    owner: Department of Statistics Malaysia
    url: https://open.dosm.gov.my/
    endpoint: https://api.data.gov.my/opendosm
    licence: >-
      DOSM Open Data License as shown in the OpenDOSM FAQ. It permits copying, publishing,
      adapting and commercial use; the datasets must not be used in a way that suggests
      official status or endorsement. The text was read on an archived copy of the FAQ
      (opendosm.netlify.app), not on open.dosm.gov.my itself, so re-read it there.
    frequency: weekly collection; series are monthly
    typical_lag: five to eight weeks
    status: amber
    publish: derived
    module: macro
    terms_checked: 2026-11-15
    notes: >-
      No key needed. Industrial production, trade, unemployment and producer prices. Trade is
      in ringgit and is not seasonally adjusted.

  imf:
    name: IMF data (International Trade in Goods, International Liquidity, Consumer Price Index)
    owner: International Monetary Fund
    url: https://data.imf.org/
    endpoint: https://api.imf.org/external/sdmx/2.1/data
    licence: >-
      IMF Copyright and Usage, Special Terms for Statistical Data
      (https://www.imf.org/en/about/copyright-and-terms). Users may download, copy, create
      derivative works, publish and distribute IMF data, with attribution in the form "Source:
      International Monetary Fund, <dataset>, <link>", saying so when the data are materially
      transformed, and without altering the data in a way that affects their accuracy.
      Commercial reuse needs the IMF's permission (copyright@imf.org). The general site terms
      also forbid bulk download by automated means without permission; this pipeline asks the
      public SDMX API for 19 series a day, which is not a bulk download of the database, but
      the IMF has not been asked to confirm that. The site is non-commercial and cites the
      IMF under every table.
    frequency: daily collection; series are monthly
    typical_lag: one to five months (trade is slowest)
    status: amber
    publish: derived
    module: macro
    terms_checked: 2026-11-15
    notes: >-
      No key needed. Exports and imports of goods and official reserves excluding gold for all
      six economies, and Vietnam's consumer prices, which the BIS does not carry. The IMF
      compiles these from each country's authorities. The terms page could not be fetched from
      GitHub's runners (HTTP 403); it was read through a web search tool on 15 November 2026.

  indeed_postings:
    name: Indeed Job Postings Index
    owner: Indeed Hiring Lab
    url: https://github.com/hiring-lab/job_postings_tracker
    endpoint: https://raw.githubusercontent.com/hiring-lab/job_postings_tracker/master/US/aggregate_job_postings_US.csv
    licence: >-
      Creative Commons Attribution 4.0 International, stated in the repository README: free
      for public use as long as Indeed Hiring Lab is cited as a source.
    frequency: weekly collection; daily index refreshed weekly
    typical_lag: about one week
    status: green
    publish: derived
    module: macro
    terms_checked: 2026-11-15
    notes: >-
      United States only; Indeed covers no Southeast Asian country. Postings on one job site,
      seasonally adjusted by Indeed, starting February 2020, so its ten-year history is short
      and its first flags come late. Daily values are averaged to complete months.

  ember_monthly:
    name: Ember Monthly Electricity Data
    owner: Ember
    url: https://ember-energy.org/data/monthly-electricity-data
    endpoint: https://files.ember-energy.org/public-downloads/generation/outputs/release_generation_monthly_global.csv
    licence: >-
      Creative Commons Attribution 4.0 (CC BY 4.0), stated on the dataset page: "All content is
      released under a Creative Commons Attribution Licence (CC-BY-4.0)." Reuse, including
      derived figures, is allowed with credit to Ember; the site credits it under every table.
    frequency: fetched at most once every six days; the publisher updates twice a month
    typical_lag: one to six months, different for each country
    status: green
    publish: derived
    module: energy
    terms_checked: 2026-11-15
    notes: >-
      Ember compiles the file from national publishers and multi-country sources, so one
      definition is applied to every country but each country arrives with its own delay.
      Monthly demand exists for the United States, Malaysia, the Philippines, Singapore,
      Thailand and Vietnam; not for Indonesia. Recent months are revised.

  census_trade:
    name: US Census Bureau, International Trade (monthly imports by Harmonized System)
    owner: US Census Bureau
    url: https://www.census.gov/foreign-trade/data/index.html
    endpoint: https://api.census.gov/data/timeseries/intltrade/imports/hs
    licence: >-
      Census Bureau Data API Terms of Service
      (https://www.census.gov/data/developers/terms-of-service.html). Products must show the
      notice "This product uses the Census Bureau Data API but is not endorsed or certified by
      the Census Bureau", must not misrepresent the data while naming the Bureau as its source,
      and must not use the data to identify a person or business. The trade pages carry the
      notice. The terms set no numeric request limit; this pipeline makes sixteen calls at most
      once every six days.
    frequency: fetched at most once every six days; Census publishes once a month
    typical_lag: about five weeks after the month ends
    status: green
    publish: derived
    module: trade
    terms_checked: 2026-11-15
    notes: >-
      Needs a free API key (repo secret CENSUS_API_KEY). General imports at customs value by
      country of origin and two-digit HS chapter, from 2013. Recent months are revised.

  usaspending:
    name: USAspending.gov (federal contract transactions)
    owner: US Department of the Treasury, Bureau of the Fiscal Service
    url: https://www.usaspending.gov/
    endpoint: https://api.usaspending.gov/api/v2/download/transactions/
    licence: >-
      No licence or terms-of-use statement was found on the pages read (the API tutorial at
      https://api.usaspending.gov/docs/intro-tutorial and "About the data" at
      https://www.usaspending.gov/data/about-the-data-download.pdf). The site is the US
      government's official open data source for federal spending, published under the DATA Act,
      and works of the US federal government are not subject to copyright in the United States.
      The API needs no key and states no request limit; this pipeline asks for about a dozen
      files at most once every six days. Only sums are stored and published, and suppliers
      outside the largest 25 of a fiscal year are never named.
    frequency: fetched at most once every six days, in the weekly run; the source updates daily
    typical_lag: about five days for civilian agencies; 90 days for the Department of Defense
    status: amber
    publish: derived
    module: procurement
    terms_checked: 2026-11-15
    notes: >-
      Contract records come from the Federal Procurement Data System. Amber because the monthly
      figure from USAspending's own search does not match the sum of the transactions it lets
      anyone download; see the Federal Procurement page and the failures log. Department of
      Defense records are held back 90 days. Payments per award were optional before fiscal 2022.

  wikimedia_pageviews:
    name: Wikimedia Pageviews API (English Wikipedia, monthly views by people)
    owner: Wikimedia Foundation
    url: https://wikitech.wikimedia.org/wiki/Analytics/AQS/Pageviews
    endpoint: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/
    licence: >-
      Not yet read for this pipeline. The pageview counts are generally described as released
      into the public domain, and the API asks callers to send a User-Agent that identifies
      them; this pipeline sends one with the repository's address. To be confirmed before any
      use beyond the Demand Radar experiment.
    frequency: fetched once for the Demand Radar experiment
    typical_lag: a day after the month ends
    status: amber
    publish: derived
    module: radar
    terms_checked: unconfirmed
    notes: >-
      Monthly views by people (agent "user") from July 2015, the first month the API separates
      people from bots. Used only summed over a fixed list of articles per category.

  census_marts:
    name: US Census Bureau, Monthly Retail Trade Survey (MARTS)
    owner: US Census Bureau
    url: https://www.census.gov/retail/index.html
    endpoint: https://api.census.gov/data/timeseries/eits/marts
    licence: >-
      Census Bureau Data API Terms of Service
      (https://www.census.gov/data/developers/terms-of-service.html), the same terms as the
      trade data: show the notice "This product uses the Census Bureau Data API but is not
      endorsed or certified by the Census Bureau", do not misrepresent the data, and do not
      use it to identify a person or business.
    frequency: fetched once for the Demand Radar experiment
    typical_lag: advance estimate about two weeks after the month ends
    status: green
    publish: derived
    module: radar
    terms_checked: 2026-11-15
    notes: >-
      Sales in millions of dollars by kind of business, not seasonally adjusted. Uses the same
      CENSUS_API_KEY secret as the trade collector. Recent months are revised.
